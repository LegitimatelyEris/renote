<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renote</title>
  <meta name="description" content="Minimalist notes that make revision more fun.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M10 9h8a5 5 0 0 1 0 10h-3l5 5' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <canvas id="specks" aria-hidden="true"></canvas>

  <header class="nav">
    <a class="brand" href="#/">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 5h8a5 5 0 0 1 0 10h-3l5 5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Renote
    </a>
    <nav class="links">
      <a href="#/" data-nav="home">Notes</a>
      <a href="#/revise" data-nav="revise">Revise</a>
      <a href="#/progress" data-nav="progress">Progress</a>
    </nav>
    <div class="nav-actions">
      <label class="search">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search notes" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button class="btn btn-white" id="new-note">New note</button>
    </div>
  </header>

  <div class="announce" id="announce"></div>

  <div class="frame">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="main" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
